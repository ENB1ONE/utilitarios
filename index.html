<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Utilitários Hub</title>
    
    <!-- PWA Manifest & iOS Meta tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="UtilHub">
    <link rel="apple-touch-icon" href="./assets/apk-downloader.jpg">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
/* 
  UX/UI Premium System 
  - Suporte nativo a Dark/Light Mode
  - Cores semânticas da Apple
  - Glassmorphism aprimorado
*/
:root {
  --bg-color: #f5f5f7;
  --bg-mesh-1: rgba(0, 122, 255, 0.12);
  --bg-mesh-2: rgba(191, 90, 242, 0.12);
  --text-main: #1d1d1f;
  --text-muted: #86868b;
  --glass-bg: rgba(255, 255, 255, 0.65);
  --glass-border: rgba(255, 255, 255, 0.6);
  --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
  --accent-color: #007aff;
  --accent-hover: #005bb5;
  --modal-bg: #ffffff;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-color: #000000;
    --bg-mesh-1: rgba(10, 132, 255, 0.15);
    --bg-mesh-2: rgba(94, 92, 230, 0.15);
    --text-main: #f5f5f7;
    --text-muted: #a1a1a6;
    --glass-bg: rgba(28, 28, 30, 0.65);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    --accent-color: #0a84ff;
    --accent-hover: #007aff;
    --modal-bg: #1c1c1e;
  }
}

body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--bg-color);
  background-image: 
    radial-gradient(at 0% 0%, var(--bg-mesh-1) 0px, transparent 50%),
    radial-gradient(at 100% 100%, var(--bg-mesh-2) 0px, transparent 50%);
  background-attachment: fixed;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.hub-container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 8vh 20px;
}

.hub-header {
  text-align: center;
  margin-bottom: 8vh;
  animation: fadeDown 0.6s ease-out;
}

@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

.hub-header h1 {
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 700;
  margin: 0 0 12px 0;
  letter-spacing: -1px;
}

.hub-header p {
  font-size: clamp(1.1rem, 3vw, 1.3rem);
  color: var(--text-muted);
  margin: 0;
  font-weight: 500;
}

/* Grid de Cards */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
  justify-items: center;
}

/* Card Style */
.util-card {
  width: 100%;
  max-width: 360px;
  background: var(--glass-bg);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--glass-border);
  border-radius: 32px;
  padding: 40px 24px;
  box-shadow: var(--glass-shadow);
  text-decoration: none;
  color: inherit;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  box-sizing: border-box;
  cursor: pointer;
  animation: fadeUp 0.6s ease-out backwards;
}

/* Animação em cascata */
.util-card:nth-child(1) { animation-delay: 0.1s; }
.util-card:nth-child(2) { animation-delay: 0.2s; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Interações Táteis (Hover/Active) */
.util-card:hover {
  transform: translateY(-6px);
  background: var(--glass-bg);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
  border-color: var(--accent-color);
}

.util-card:active {
  transform: scale(0.97);
}

.card-icon {
  width: 100px;
  height: 100px;
  border-radius: 24px;
  margin-bottom: 24px;
  object-fit: cover;
  box-shadow: 0 12px 24px rgba(0,0,0,0.1);
  background: var(--glass-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
}

.util-card h2 {
  font-size: 1.4rem;
  font-weight: 600;
  margin: 0 0 8px 0;
}

.util-card p {
  font-size: 0.95rem;
  color: var(--text-muted);
  margin: 0;
  line-height: 1.5;
}

/* Placeholder */
.util-card.disabled {
  pointer-events: none;
  opacity: 0.6;
  border: 1px dashed var(--text-muted);
}

.card-icon.placeholder {
  border: none;
  background: transparent;
  box-shadow: none;
}

/* Modal iOS */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 9999;
  padding: 16px;
}

.modal-content {
  background: var(--modal-bg);
  width: 100%;
  max-width: 400px;
  border-radius: 28px;
  padding: 32px 24px;
  text-align: center;
  box-shadow: 0 24px 48px rgba(0,0,0,0.2);
  animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  border: 1px solid var(--glass-border);
}

@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-icon { font-size: 3rem; margin-bottom: 16px; }
.modal-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; }
.modal-text { font-size: 1rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }

.modal-btn-primary {
  background: var(--accent-color);
  color: #fff;
  border: none;
  padding: 16px 20px;
  width: 100%;
  border-radius: 16px;
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.modal-btn-primary:active { transform: scale(0.96); }

.modal-btn-secondary {
  background: transparent;
  color: var(--accent-color);
  border: none;
  padding: 12px;
  width: 100%;
  font-size: 1.05rem;
  font-weight: 500;
  cursor: pointer;
}
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('./sw.js').catch(()=>{});
        }

        function Hub() {
          const [deferredPrompt, setDeferredPrompt] = useState(null);
          const [showIOSModal, setShowIOSModal] = useState(false);
          const [targetUrl, setTargetUrl] = useState('');

          useEffect(() => {
            window.addEventListener('beforeinstallprompt', (e) => {
              e.preventDefault();
              setDeferredPrompt(e);
            });
          }, []);

          const isIOS = () => {
            return [
              'iPad Simulator', 'iPhone Simulator', 'iPod Simulator', 'iPad', 'iPhone', 'iPod'
            ].includes(navigator.platform) || (navigator.userAgent.includes("Mac") && "ontouchend" in document)
          }

          const handleCardClick = (e, url) => {
            e.preventDefault();
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            
            if (isStandalone) {
                window.location.href = url;
                return;
            }

            if (isIOS()) {
                setTargetUrl(url);
                setShowIOSModal(true);
            } else if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    setDeferredPrompt(null);
                    window.location.href = url;
                });
            } else {
                window.location.href = url;
            }
          };

          return (
            <div className="hub-container">
              <header className="hub-header">
                <h1>Utilitários</h1>
                <p>Produtividade instantânea. Instale e acesse de qualquer lugar.</p>
              </header>

              <main className="cards-grid">
                
                <div onClick={(e) => handleCardClick(e, './apk-downloader/')} className="util-card" role="button" tabIndex="0">
                  <img src="./assets/apk-downloader.jpg" alt="APK Downloader Logo" className="card-icon" />
                  <h2>APK Downloader</h2>
                  <p>Extraia pacotes nativos da Play Store de forma segura. Detecta a arquitetura ideal automaticamente.</p>
                </div>

                <div className="util-card disabled">
                  <div className="card-icon placeholder">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <circle cx="12" cy="12" r="10"></circle>
                      <line x1="12" y1="8" x2="12" y2="16"></line>
                      <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                  </div>
                  <h2>Em Breve</h2>
                  <p>Estamos polindo um novo utilitário. A excelência leva algum tempo.</p>
                </div>

              </main>

              {showIOSModal && (
                <div className="modal-overlay" onClick={() => setShowIOSModal(false)}>
                  <div className="modal-content" onClick={e => e.stopPropagation()}>
                    <div className="modal-icon">📱</div>
                    <h2 className="modal-title">Instale no seu iOS</h2>
                    <p className="modal-text">
                      Para usar como um aplicativo nativo, toque no ícone de <b>Compartilhar</b> na barra inferior do Safari e escolha <b>"Adicionar à Tela de Início"</b>.
                    </p>
                    <button className="modal-btn-primary" onClick={() => setShowIOSModal(false)}>Entendi</button>
                    <button className="modal-btn-secondary" onClick={() => window.location.href = targetUrl}>Acessar via navegador agora</button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Hub />);
    </script>
</body>
</html>
