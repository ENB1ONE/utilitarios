<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PureVoid Downloader</title>
    
    <!-- Meta tags para evitar cache permanente no iOS WebClip e navegadores -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PureVoid">
    <link rel="apple-touch-icon" href="icon-512.png">

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #000000;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      .app-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        flex-direction: column;
        position: relative;
        padding: 20px;
        box-sizing: border-box;
      }
      
      /* Tela Inicial: Buraco Negro */
      .main-view {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .blackhole-btn {
        width: 250px;
        height: 250px;
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        -webkit-tap-highlight-color: transparent;
      }
      .blackhole-btn:active {
        transform: scale(0.92);
      }
      .blackhole-btn img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      .pulsing {
        animation: pulse 1s infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 1; filter: brightness(1); }
        100% { transform: scale(0.85); opacity: 0.7; filter: brightness(1.5); }
      }
      .status-text {
        color: #8e8e93;
        font-size: 0.95rem;
        font-weight: 500;
        margin-top: 24px;
        text-align: center;
        min-height: 24px;
        transition: opacity 0.2s;
      }
      .error-text {
        color: #ff3b30;
        margin-top: 16px;
        font-size: 0.9rem;
        font-weight: 500;
        text-align: center;
        width: 100%;
        max-width: 320px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .error-text.visible {
        opacity: 1;
      }

      /* Tela de Resultado: Pré-visualização do Vídeo e Salvar na Galeria */
      .result-view {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 380px;
        box-sizing: border-box;
        animation: scaleFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 10;
      }
      @keyframes scaleFadeIn {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
      }
      .video-wrapper {
        width: 100%;
        max-height: 46vh;
        border-radius: 22px;
        overflow: hidden;
        background: #111113;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.14);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .video-player {
        width: 100%;
        max-height: 46vh;
        object-fit: contain;
        display: block;
        background: #000000;
      }
      .video-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: #f2f2f7;
        margin: 14px 0 16px 0;
        text-align: center;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }
      .btn-save-gallery {
        width: 100%;
        background: #ffffff;
        color: #000000;
        border: none;
        border-radius: 16px;
        padding: 15px 20px;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
        transition: transform 0.15s, background-color 0.2s;
        -webkit-tap-highlight-color: transparent;
      }
      .btn-save-gallery:active {
        transform: scale(0.96);
        background: #e5e5ea;
      }
      .btn-save-gallery.loading {
        opacity: 0.75;
        cursor: wait;
      }
      .ios-tip {
        font-size: 0.78rem;
        color: #8e8e93;
        margin: 8px 0 16px 0;
        text-align: center;
        line-height: 1.4;
      }
      .ios-tip b {
        color: #ffffff;
      }
      .actions-secondary {
        display: flex;
        gap: 12px;
        width: 100%;
      }
      .btn-secondary {
        flex: 1;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #d1d1d6;
        border-radius: 14px;
        padding: 11px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        -webkit-tap-highlight-color: transparent;
      }
      .btn-secondary:active {
        transform: scale(0.96);
        background: rgba(255, 255, 255, 0.16);
        color: #ffffff;
      }

      /* Elementos Globais */
      .version-badge {
        position: fixed;
        bottom: 16px;
        font-size: 0.75rem;
        color: #48484a;
        font-weight: 500;
        letter-spacing: 0.5px;
        cursor: pointer;
        padding: 6px 14px;
        border-radius: 20px;
        transition: all 0.2s ease;
        user-select: none;
        -webkit-user-select: none;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        z-index: 50;
      }
      .version-badge:active {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.15);
        transform: scale(0.95);
      }
      .update-toast {
        position: fixed;
        top: 24px;
        background: rgba(28, 28, 30, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        padding: 10px 20px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transform: translateY(-20px);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
        z-index: 2000;
      }
      .update-toast.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .install-banner {
        position: fixed; bottom: 0; left: 0; width: 100%;
        background: rgba(28, 28, 30, 0.85);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        padding: 16px 24px; display: flex; justify-content: space-between;
        align-items: center; box-sizing: border-box; z-index: 100;
      }
      .install-text { margin: 0; font-size: 0.95rem; font-weight: 600; color: #ffffff; }
      .install-text span { display: block; font-size: 0.8rem; font-weight: 400; color: #a1a1a6; margin-top: 2px; }
      .install-btn {
        background: #ffffff; color: #000000; border: none; border-radius: 20px;
        padding: 8px 16px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
      }
      .modal-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
        z-index: 1000; padding: 20px;
      }
      .modal-content {
        background: #1c1c1e; padding: 24px; border-radius: 24px; width: 100%;
        max-width: 320px; text-align: center; color: white;
      }
      .modal-btn-primary {
        background: white; color: black; border: none; padding: 12px 0;
        width: 100%; border-radius: 12px; font-size: 1rem; font-weight: 600; margin-top: 16px;
      }
      .hidden {
        display: none !important;
      }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Tela Principal: Buraco Negro -->
        <div class="main-view" id="mainView">
            <div class="blackhole-btn" id="magicBtn">
                <img src="../assets/purevoid-hd.jpg" alt="PureVoid" id="magicIcon" />
            </div>
            <div class="status-text" id="statusText">Toque no círculo para colar e baixar</div>
            <div class="error-text" id="errorText"></div>
        </div>

        <!-- Tela de Resultado: Player e Salvar na Galeria -->
        <div class="result-view hidden" id="resultView">
            <div class="video-wrapper">
                <video id="videoPlayer" class="video-player" playsinline controls loop preload="auto"></video>
            </div>
            <div class="video-title" id="videoTitle"></div>
            
            <button class="btn-save-gallery" id="saveGalleryBtn">
                <span>🖼️</span> Salvar na Galeria
            </button>
            <p class="ios-tip" id="iosTip">Toque em <b>"Salvar Vídeo"</b> na folha de opções para guardar nas Fotos.</p>
            
            <div class="actions-secondary">
                <button class="btn-secondary" id="directDownloadBtn">⬇️ Baixar Arquivo</button>
                <button class="btn-secondary" id="resetBtn">🔄 Novo Link</button>
            </div>
        </div>

        <div class="version-badge" id="versionBadge" title="Toque para checar atualizações | Toque duplo para forçar recarga">v1.3.0</div>
        <div class="update-toast" id="updateToast"></div>

        <div class="install-banner hidden" id="installBanner">
            <p class="install-text">Instale o PureVoid <span>Rápido. Nativo. Sem anúncios.</span></p>
            <button class="install-btn" id="installBtn">Instalar</button>
        </div>

        <div class="modal-overlay hidden" id="iosModal">
            <div class="modal-content" id="iosModalContent">
            <h2 style="margin-top:0">Instale no iOS</h2>
            <p style="color: #a1a1a6; line-height: 1.5">
                Toque em <b>Compartilhar</b> no Safari e escolha <b>"Adicionar à Tela de Início"</b>.
            </p>
            <button class="modal-btn-primary" id="closeIosModalBtn">Entendi</button>
            </div>
        </div>
    </div>

    <script>
        const APP_VERSION = '1.3.0';

        // Registro e ciclo de vida do Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((reg) => {
                    console.log('[PureVoid SW] Registrado');
                    reg.update();
                }).catch(err => console.warn('[PureVoid SW] Erro:', err));
            });

            let isRefreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!isRefreshing) {
                    isRefreshing = true;
                    window.location.reload();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            let deferredPrompt = null;
            let isLoading = false;
            let currentDownloadLink = '';
            let currentCleanTitle = 'video';
            let currentFilename = 'video.mp4';
            let currentFile = null;
            let currentBlobUrl = null;

            const mainView = document.getElementById('mainView');
            const magicBtn = document.getElementById('magicBtn');
            const magicIcon = document.getElementById('magicIcon');
            const statusText = document.getElementById('statusText');
            const errorText = document.getElementById('errorText');

            const resultView = document.getElementById('resultView');
            const videoPlayer = document.getElementById('videoPlayer');
            const videoTitle = document.getElementById('videoTitle');
            const saveGalleryBtn = document.getElementById('saveGalleryBtn');
            const iosTip = document.getElementById('iosTip');
            const directDownloadBtn = document.getElementById('directDownloadBtn');
            const resetBtn = document.getElementById('resetBtn');

            const installBanner = document.getElementById('installBanner');
            const installBtn = document.getElementById('installBtn');
            const iosModal = document.getElementById('iosModal');
            const iosModalContent = document.getElementById('iosModalContent');
            const closeIosModalBtn = document.getElementById('closeIosModalBtn');
            const versionBadge = document.getElementById('versionBadge');
            const updateToast = document.getElementById('updateToast');

            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            if (!isStandalone) {
                installBanner.classList.remove('hidden');
            }

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
            });

            const isIOS = () => {
                return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            };

            if (!isIOS()) {
                iosTip.textContent = "Toque no botão para salvar ou compartilhar diretamente no seu aparelho.";
            }

            const showError = (msg) => {
                errorText.textContent = msg;
                errorText.classList.add('visible');
                setTimeout(() => {
                    errorText.classList.remove('visible');
                }, 4000);
            };

            const showToast = (msg, duration = 2500) => {
                if (!updateToast) return;
                updateToast.textContent = msg;
                updateToast.classList.add('visible');
                setTimeout(() => {
                    updateToast.classList.remove('visible');
                }, duration);
            };

            // Mecanismo de Atualização Forçada (PWA / WebClip)
            const executeForceReload = (newVersion) => {
                const url = new URL(window.location.href);
                url.searchParams.set('v', newVersion);
                url.searchParams.set('_t', Date.now().toString());
                window.location.replace(url.toString());
            };

            const purgeCachesAndReload = async (newVersion) => {
                showToast(`Atualizando PureVoid (${newVersion})...`, 4000);
                
                if ('caches' in window) {
                    try {
                        const keys = await caches.keys();
                        await Promise.all(keys.map(k => caches.delete(k)));
                    } catch (e) {
                        console.warn('[PureVoid] Erro ao limpar caches:', e);
                    }
                }

                if ('serviceWorker' in navigator) {
                    try {
                        const regs = await navigator.serviceWorker.getRegistrations();
                        for (const r of regs) {
                            await r.update();
                        }
                    } catch (e) {
                        console.warn('[PureVoid] Erro ao atualizar SW:', e);
                    }
                }

                localStorage.setItem('purevoid_version', newVersion);

                setTimeout(() => {
                    executeForceReload(newVersion);
                }, 500);
            };

            const checkAppUpdate = async (isManual = false) => {
                try {
                    if (isManual) {
                        versionBadge.textContent = '🔄 Checando...';
                    }

                    const response = await fetch(`./version.json?_t=${Date.now()}`, {
                        cache: 'no-store',
                        headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
                    });

                    if (!response.ok) {
                        if (isManual) {
                            versionBadge.textContent = `v${APP_VERSION}`;
                            showToast('Servidor indisponível.');
                        }
                        return;
                    }

                    const data = await response.json();
                    const serverVersion = data.version;

                    if (serverVersion && serverVersion !== APP_VERSION) {
                        console.log(`[PureVoid] Nova versão encontrada: ${serverVersion} (atual: ${APP_VERSION})`);
                        await purgeCachesAndReload(serverVersion);
                    } else {
                        localStorage.setItem('purevoid_version', APP_VERSION);
                        if (isManual) {
                            versionBadge.textContent = `✓ v${APP_VERSION} (Atualizado)`;
                            showToast('PureVoid já está na versão mais recente!');
                            setTimeout(() => {
                                versionBadge.textContent = `v${APP_VERSION}`;
                            }, 2500);
                        }
                    }
                } catch (err) {
                    console.warn('[PureVoid] Falha na checagem de update:', err);
                    if (isManual) {
                        versionBadge.textContent = `v${APP_VERSION}`;
                        showToast('Erro ao checar atualizações.');
                    }
                }
            };

            // Gatilhos automáticos de verificação
            checkAppUpdate(false);

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    checkAppUpdate(false);
                }
            });

            window.addEventListener('pageshow', (event) => {
                if (event.persisted) {
                    checkAppUpdate(false);
                }
            });

            setInterval(() => checkAppUpdate(false), 300000);

            versionBadge.addEventListener('click', () => {
                checkAppUpdate(true);
            });

            versionBadge.addEventListener('dblclick', () => {
                purgeCachesAndReload(APP_VERSION);
            });

            let lastTapTime = 0;
            versionBadge.addEventListener('touchend', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                if (tapLength < 400 && tapLength > 0) {
                    e.preventDefault();
                    purgeCachesAndReload(APP_VERSION);
                }
                lastTapTime = currentTime;
            });

            installBtn.addEventListener('click', () => {
                if (isIOS()) {
                    iosModal.classList.remove('hidden');
                } else if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then(() => { 
                        deferredPrompt = null; 
                        installBanner.classList.add('hidden'); 
                    });
                } else {
                    alert("Instruções: Procure por 'Instalar Aplicativo' ou 'Adicionar à Tela Inicial' no menu do navegador.");
                }
            });

            closeIosModalBtn.addEventListener('click', () => {
                iosModal.classList.add('hidden');
            });

            iosModal.addEventListener('click', () => {
                iosModal.classList.add('hidden');
            });

            iosModalContent.addEventListener('click', (e) => {
                e.stopPropagation();
            });

            // Extração e download da mídia
            const processDownload = async (targetUrl) => {
                if (!targetUrl) return;
                isLoading = true;
                magicIcon.classList.add('pulsing');
                statusText.textContent = "Conectando ao buraco negro...";
                
                try {
                    statusText.textContent = "Processando e preparando o vídeo...";
                    const response = await fetch('https://stuart-facing-disclaimers-fallen.trycloudflare.com/api/void', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: targetUrl }),
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.detail || "Erro ao conectar com o servidor.");
                    
                    if (data.download_link) {
                        currentDownloadLink = data.download_link;
                        currentCleanTitle = (data.title || "video").replace(/[\\/*?:"<>|]/g, "").trim() || "video";
                        currentFilename = `${currentCleanTitle}.mp4`;

                        videoTitle.textContent = currentCleanTitle;
                        videoPlayer.src = currentDownloadLink;
                        videoPlayer.play().catch(() => {});

                        // Exibe a tela de resultado com o vídeo já tocando
                        mainView.classList.add('hidden');
                        resultView.classList.remove('hidden');

                        saveGalleryBtn.innerHTML = '<span>⏳</span> Carregando para a Galeria...';
                        saveGalleryBtn.classList.add('loading');

                        // Pré-carrega o Blob em memória em paralelo para que o clique em "Salvar na Galeria" seja 100% instantâneo
                        try {
                            const resBlob = await fetch(currentDownloadLink);
                            if (resBlob.ok) {
                                const blob = await resBlob.blob();
                                currentFile = new File([blob], currentFilename, { type: 'video/mp4' });
                                if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                                currentBlobUrl = URL.createObjectURL(blob);
                                videoPlayer.src = currentBlobUrl;
                                videoPlayer.play().catch(() => {});
                            }
                        } catch (blobErr) {
                            console.warn("Pré-carregamento do blob falhou:", blobErr);
                        } finally {
                            saveGalleryBtn.classList.remove('loading');
                            saveGalleryBtn.innerHTML = '<span>🖼️</span> Salvar na Galeria';
                        }
                    }
                } catch (err) {
                    showError(err.message);
                    statusText.textContent = "Toque no círculo para colar e baixar";
                } finally {
                    isLoading = false;
                    magicIcon.classList.remove('pulsing');
                }
            };

            // Botão Salvar na Galeria (Aciona Share Sheet nativo do iOS para salvar no Rolo da Câmera)
            saveGalleryBtn.addEventListener('click', async () => {
                if (saveGalleryBtn.classList.contains('loading')) return;

                if (currentFile && navigator.canShare && navigator.canShare({ files: [currentFile] })) {
                    try {
                        await navigator.share({
                            files: [currentFile],
                            title: currentCleanTitle
                        });
                        return;
                    } catch (err) {
                        if (err.name === 'AbortError') {
                            return; // Usuário apenas fechou a folha de compartilhamento
                        }
                        console.warn("Erro no navigator.share:", err);
                    }
                }

                // Fallback se navigator.share não suportar ou falhar:
                if (isIOS()) {
                    window.location.href = currentDownloadLink;
                } else {
                    const a = document.createElement('a');
                    a.href = currentBlobUrl || currentDownloadLink;
                    a.download = currentFilename;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => a.remove(), 1000);
                }
            });

            // Botão de Download Direto de Arquivo
            directDownloadBtn.addEventListener('click', () => {
                if (isIOS()) {
                    window.location.href = currentDownloadLink;
                } else {
                    const a = document.createElement('a');
                    a.href = currentBlobUrl || currentDownloadLink;
                    a.download = currentFilename;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => a.remove(), 1000);
                }
            });

            // Botão Reset para Novo Link
            resetBtn.addEventListener('click', () => {
                videoPlayer.pause();
                videoPlayer.removeAttribute('src');
                videoPlayer.load();

                if (currentBlobUrl) {
                    URL.revokeObjectURL(currentBlobUrl);
                    currentBlobUrl = null;
                }
                currentFile = null;
                currentDownloadLink = '';

                resultView.classList.add('hidden');
                mainView.classList.remove('hidden');
                statusText.textContent = "Toque no círculo para colar e baixar";
                magicIcon.classList.remove('pulsing');
                isLoading = false;
            });

            // Gatilho do Buraco Negro
            magicBtn.addEventListener('click', async () => {
                if (isLoading) return;
                try {
                    const text = await navigator.clipboard.readText();
                    if (text && (text.includes("http://") || text.includes("https://"))) {
                        processDownload(text);
                    } else {
                        showError("Nenhum link válido encontrado na área de transferência.");
                    }
                } catch (err) {
                    showError("Para a mágica funcionar, aceite colar o link do clipboard.");
                }
            });
        });
    </script>
</body>
</html>
