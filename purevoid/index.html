<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PureVoid Downloader</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PureVoid">
    <link rel="apple-touch-icon" href="icon-512.png">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #000000;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      .app-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        flex-direction: column;
      }
      .blackhole-btn {
        width: 250px;
        height: 250px;
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        -webkit-tap-highlight-color: transparent;
      }
      .blackhole-btn:active {
        transform: scale(0.92);
      }
      .blackhole-btn img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      .pulsing {
        animation: pulse 1s infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 1; filter: brightness(1); }
        100% { transform: scale(0.85); opacity: 0.7; filter: brightness(1.5); }
      }
      .error-text {
        color: #ff3b30;
        margin-top: 30px;
        font-size: 1rem;
        font-weight: 500;
        text-align: center;
        width: 100%;
        max-width: 80%;
      }
      .install-banner {
        position: fixed; bottom: 0; left: 0; width: 100%;
        background: rgba(28, 28, 30, 0.85);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        padding: 16px 24px; display: flex; justify-content: space-between;
        align-items: center; box-sizing: border-box; z-index: 100;
      }
      .install-text { margin: 0; font-size: 0.95rem; font-weight: 600; color: #ffffff; }
      .install-text span { display: block; font-size: 0.8rem; font-weight: 400; color: #a1a1a6; margin-top: 2px; }
      .install-btn {
        background: #ffffff; color: #000000; border: none; border-radius: 20px;
        padding: 8px 16px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
      }
      .modal-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
        z-index: 1000; padding: 20px;
      }
      .modal-content {
        background: #1c1c1e; padding: 24px; border-radius: 24px; width: 100%;
        max-width: 320px; text-align: center; color: white;
      }
      .modal-btn-primary {
        background: white; color: black; border: none; padding: 12px 0;
        width: 100%; border-radius: 12px; font-size: 1rem; font-weight: 600; margin-top: 16px;
      }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
          const [isLoading, setIsLoading] = useState(false);
          const [error, setError] = useState('');
          
          const [deferredPrompt, setDeferredPrompt] = useState(null);
          const [showIOSModal, setShowIOSModal] = useState(false);
          const [showBanner, setShowBanner] = useState(false);

          useEffect(() => {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            if (!isStandalone) setShowBanner(true);

            window.addEventListener('beforeinstallprompt', (e) => {
              e.preventDefault();
              setDeferredPrompt(e);
            });
          }, []);

          const isIOS = () => {
            return ['iPad Simulator', 'iPhone Simulator', 'iPod Simulator', 'iPad', 'iPhone', 'iPod'].includes(navigator.platform) || (navigator.userAgent.includes("Mac") && "ontouchend" in document)
          }

          const handleInstallClick = () => {
             if (isIOS()) setShowIOSModal(true);
             else if (deferredPrompt) {
                 deferredPrompt.prompt();
                 deferredPrompt.userChoice.then(() => { setDeferredPrompt(null); setShowBanner(false); });
             } else {
                 alert("Instruções: Procure por 'Instalar Aplicativo' ou 'Adicionar à Tela Inicial'.");
             }
          }

          const processDownload = async (targetUrl) => {
            if (!targetUrl) return;
            setIsLoading(true);
            setError('');
            
            try {
              const response = await fetch('https://twist-associate-mazda-mostly.trycloudflare.com/api/void', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: targetUrl }),
              });
              const data = await response.json();
              if (!response.ok) throw new Error(data.detail || "Erro ao servidor.");
              
              if (data.download_link) {
                  window.location.href = data.download_link;
              }
            } catch (err) {
              setError(err.message);
              setTimeout(() => setError(''), 4000);
            } finally {
              setIsLoading(false);
            }
          };

          const handleMagicClick = async () => {
            if (isLoading) return;
            try {
              const text = await navigator.clipboard.readText();
              if (text && (text.includes("http://") || text.includes("https://"))) {
                processDownload(text);
              } else {
                setError("Nenhum link válido encontrado na área de transferência.");
                setTimeout(() => setError(''), 4000);
              }
            } catch (err) {
                setError("Permissão para ler a área de transferência negada.");
                setTimeout(() => setError(''), 4000);
            }
          };

          return (
            <div className="app-container">
              <div className="blackhole-btn" onClick={handleMagicClick}>
                <img src="../assets/purevoid-icon.png" alt="PureVoid" className={isLoading ? "pulsing" : ""} />
              </div>
              
              {error && <div className="error-text">{error}</div>}

              {showBanner && (
                  <div className="install-banner">
                      <p className="install-text">Instale o PureVoid <span>Rápido. Nativo. Sem anúncios.</span></p>
                      <button className="install-btn" onClick={handleInstallClick}>Instalar</button>
                  </div>
              )}

              {showIOSModal && (
                <div className="modal-overlay" onClick={() => setShowIOSModal(false)}>
                  <div className="modal-content" onClick={e => e.stopPropagation()}>
                    <h2 style={{marginTop:0}}>Instale no iOS</h2>
                    <p style={{color: '#a1a1a6', lineHeight: '1.5'}}>
                      Toque em <b>Compartilhar</b> no Safari e escolha <b>"Adicionar à Tela de Início"</b>.
                    </p>
                    <button className="modal-btn-primary" onClick={() => setShowIOSModal(false)}>Entendi</button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
